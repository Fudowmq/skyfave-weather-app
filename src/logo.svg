<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DBEAFE"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="18" fill="url(#bg)"/>

  <!-- свечение и солнце -->
  <circle cx="40" cy="24" r="17" fill="#FDE68A" opacity="0.28"/>
  <circle cx="40" cy="24" r="11" fill="url(#sun)"/>

  <!-- облако -->
  <g fill="url(#cloud)">
    <circle cx="23" cy="42" r="7"/>
    <circle cx="33" cy="37" r="10"/>
    <circle cx="43" cy="42" r="7"/>
    <rect x="23" y="42" width="20" height="7"/>
  </g>

  <!-- искорка -->
  <path d="M17 11Q17.8 17.2 24 18Q17.8 18.8 17 25Q16.2 18.8 10 18Q16.2 17.2 17 11Z" fill="#fff"/>
</svg>